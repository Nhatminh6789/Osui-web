<!DOCTYPE html>
<html lang="vi" data-title="rankTitle" data-page="rank"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bảng xếp hạng - Osui!</title>
<link rel="icon" href="assets/logo.png"><meta name="theme-color" content="#2a1f55">
<script>
// Link cũ (rank.html#me, #u/..., #friends, #login) -> chuyển sang trang riêng
(function(){var h=location.hash.slice(1).split('/'),k=h[0];
 if(k==='me'||k==='u'||k==='friends')location.replace('profile.html'+location.hash);
 else if(k==='login')location.replace('login.html#'+(h[1]==='up'?'up':'in'))})();
</script>
<link rel="stylesheet" href="menu.css">
<style>
:root{--bg:#1c1438;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.12);--pink:#ff4f9a;--tx:#f4f0ff;--dim:rgba(244,240,255,.68);color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--tx);background:radial-gradient(1200px 600px at 50% -10%,#4a3590 0,transparent 60%),var(--bg);min-height:100vh;line-height:1.5;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
a{color:inherit}
.w{max-width:860px;margin:0 auto;padding:16px 16px 56px}
nav{display:flex;align-items:center;gap:12px;padding:6px 0 16px}
nav .lg{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;text-decoration:none;margin-right:auto}nav .lg img{width:34px;height:34px}
.tab{display:flex;gap:6px;margin:0 0 14px;flex-wrap:wrap}.tab button{padding:8px 16px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--dim);font:inherit;font-weight:600;cursor:pointer}.tab button.on{background:var(--pink);color:#fff;border-color:var(--pink)}
section{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
h1{font-size:26px;margin:0 0 14px}
table{width:100%;border-collapse:collapse;font-size:14px}th{color:var(--dim);font-weight:600;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}td{padding:9px 8px;border-bottom:1px solid rgba(255,255,255,.07);vertical-align:middle}
tr.cl{cursor:pointer}tr.cl:hover td{background:rgba(255,255,255,.05)}
.num{text-align:right;font-variant-numeric:tabular-nums}.rk1{color:#ffd84d;font-weight:800}.rk2{color:#d6dbe6;font-weight:800}.rk3{color:#e0a070;font-weight:800}
.sc{overflow-x:auto}.dim{color:var(--dim)}.msg{margin:10px 0;font-size:14px}.msg.er{color:#ff9a9a}
.av{display:inline-flex;align-items:center;justify-content:center;flex:none;width:var(--s,32px);height:var(--s,32px);border-radius:50%;background:linear-gradient(135deg,#ff5a5f,#fa5a9b) center/cover no-repeat;color:#fff;font-weight:800;font-size:calc(var(--s,32px)*.45);vertical-align:middle;overflow:hidden;font-style:normal}
.pid{display:flex;align-items:center;gap:8px}
.langbtn{appearance:none;cursor:pointer;font:inherit;font-weight:800;font-size:13px;height:42px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--tx)}
@media(max-width:560px){.hm{display:none}td,th{padding:8px 5px}}
</style></head><body>
<div class="w">
<nav><button class="mb" id="mb" type="button" aria-label="Menu" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M4 6.5h16M4 12h16M4 17.5h16"/></svg><i class="dot"></i></button>
<a class="lg" href="index.html"><img src="assets/logo.png" alt="">Osui!</a><button class="langbtn" type="button">EN</button></nav>
<main id="app"><section data-i="loading">Đang tải…</section></main>
</div>
<script src="i18n.js"></script>
<script src="firebase-config.js"></script>
<script src="menu.js"></script>
<script type="module">
import {S,t,$,esc,num,av,ERR,sec,init,watch,notCfg} from './common.js';
I18N.apply();
if(!await init({fs:true}).catch(e=>{console.error(e);return false}))notCfg();
else{
const {fs,D}=S;
async function top(mode){mode=mode==='mania'?'mania':'std';
 sec('<h1>'+t('top50H')+'</h1><div class="tab"><button data-m="std" class="'+(mode==='std'?'on':'')+'">'+t('osu')+'</button><button data-m="mania" class="'+(mode==='mania'?'on':'')+'">'+t('mania')+'</button></div><div id="tb" class="sc">'+t('loading')+'</div><p class="dim" style="font-size:12px;margin-bottom:0">'+t('ppNote')+'</p>');
 document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{location.hash='#top/'+b.dataset.m});
 try{const f='pp_'+mode,s=await fs.getDocs(fs.query(fs.collection(D,'users'),fs.orderBy(f,'desc'),fs.limit(50))),a=[];s.forEach(d=>{const x=d.data();if(x[f]>0)a.push({id:d.id,...x})});
  if(!$('tb'))return;
  $('tb').innerHTML=a.length?'<table><tr><th>#</th><th>'+t('player')+'</th><th class="num">'+t('pp')+'</th><th class="num hm">'+t('plays')+'</th></tr>'+a.map((u,i)=>'<tr class="cl" data-u="'+esc(u.id)+'"><td class="'+(i<3?'rk'+(i+1):'')+'">'+(i+1)+'</td><td><div class="pid">'+av(u,28)+esc(u.name)+'</div></td><td class="num"><b>'+num(u[f],2)+'</b></td><td class="num hm">'+num(u.plays)+'</td></tr>').join('')+'</table>':'<p class="dim">'+t('noRank')+'</p>';
  $('tb').querySelectorAll('[data-u]').forEach(r=>r.onclick=()=>{location.href='profile.html#u/'+r.dataset.u})}
 catch(e){if($('tb'))$('tb').innerHTML='<p class="msg er">'+ERR(e)+'</p>'}}
const route=()=>{const p=(location.hash||'#top').slice(1).split('/');top(p[0]==='top'?p[1]:'std')};
addEventListener('hashchange',route);
I18N.onChange(route);
route();
watch(()=>{}); // chỉ để menu biết đã đăng nhập chưa
}
</script></body></html>
