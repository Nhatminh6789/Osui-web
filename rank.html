<!DOCTYPE html>
<html lang="vi" data-title="rankTitle"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bảng xếp hạng - Osui!</title>
<link rel="icon" href="assets/logo.png"><meta name="theme-color" content="#2a1f55">
<style>
:root{--bg:#1c1438;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.12);--pink:#ff4f9a;--tx:#f4f0ff;--dim:rgba(244,240,255,.68);color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--tx);background:radial-gradient(1200px 600px at 50% -10%,#4a3590 0,transparent 60%),var(--bg);min-height:100vh;line-height:1.5;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
a{color:inherit}
.w{max-width:860px;margin:0 auto;padding:16px 16px 56px}
nav{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:6px 0 16px}
nav .lg{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;text-decoration:none;margin-right:auto}nav .lg img{width:34px;height:34px}
.btn{appearance:none;border:1px solid var(--line);cursor:pointer;font:inherit;font-weight:700;font-size:14px;padding:9px 16px;border-radius:12px;text-decoration:none;display:inline-flex;align-items:center;background:var(--card);color:var(--tx)}
.btn.p{background:linear-gradient(135deg,#ff5a5f,#fa5a9b);border:0;color:#fff}.btn:hover{filter:brightness(1.12)}.btn[disabled]{opacity:.5}
.tab{display:flex;gap:6px;margin:0 0 14px;flex-wrap:wrap}.tab button{padding:8px 16px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--dim);font:inherit;font-weight:600;cursor:pointer}.tab button.on{background:var(--pink);color:#fff;border-color:var(--pink)}
section{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
h1{font-size:26px;margin:0 0 14px}h2{font-size:18px;margin:0 0 10px}
table{width:100%;border-collapse:collapse;font-size:14px}th{color:var(--dim);font-weight:600;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}td{padding:9px 8px;border-bottom:1px solid rgba(255,255,255,.07);vertical-align:middle}
tr.cl{cursor:pointer}tr.cl:hover td{background:rgba(255,255,255,.05)}
.num{text-align:right;font-variant-numeric:tabular-nums}.rk1{color:#ffd84d;font-weight:800}.rk2{color:#d6dbe6;font-weight:800}.rk3{color:#e0a070;font-weight:800}
.sc{overflow-x:auto}.dim{color:var(--dim)}.mod{display:inline-block;font-size:11px;font-weight:700;padding:1px 6px;border-radius:6px;background:rgba(255,255,255,.14);margin-right:3px}
.rkc{font-weight:800}.rkc.S,.rkc.SS{color:#ffd84d}.rkc.A{color:#7ddc4a}.rkc.B{color:#4aa8ff}.rkc.C{color:#c77dff}.rkc.D{color:#ff5a5a}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}.stat{background:rgba(0,0,0,.2);border-radius:14px;padding:12px}.stat small{color:var(--dim);display:block}.stat b{font-size:22px}
form{max-width:380px;margin:0 auto}input{width:100%;padding:12px;margin:6px 0;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.28);color:var(--tx);font:inherit}
.msg{margin:10px 0;font-size:14px}.msg.er{color:#ff9a9a}.msg.ok{color:#8f6}
.ti{font-weight:700}.ar{color:var(--dim);font-size:12px}
.av{display:inline-flex;align-items:center;justify-content:center;flex:none;width:var(--s,32px);height:var(--s,32px);border-radius:50%;background:linear-gradient(135deg,#ff5a5f,#fa5a9b) center/cover no-repeat;color:#fff;font-weight:800;font-size:calc(var(--s,32px)*.45);vertical-align:middle;overflow:hidden;font-style:normal}
.pid{display:flex;align-items:center;gap:8px}
.phead{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:16px}.phead h1{margin:0}.phead .grow{flex:1;min-width:150px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:10px}.btn.dg{color:#ff9a9a}
.langbtn{appearance:none;cursor:pointer;font:inherit;font-weight:800;font-size:13px;padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--tx)}
.bdg{display:inline-block;min-width:18px;padding:0 6px;margin-left:6px;border-radius:9px;background:var(--pink);color:#fff;font-size:12px;font-weight:800;line-height:18px;text-align:center}
.row2{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid rgba(255,255,255,.07)}.row2:last-child{border:0}.row2 .nm{flex:1;min-width:0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}.row2 .nm small{display:block;color:var(--dim);font-weight:400;font-size:12px}
.fgrp{margin-top:20px}.fgrp h2{margin-bottom:4px}
.addf{display:flex;gap:8px;max-width:420px}.addf input{margin:0}
.hint{color:var(--dim);font-size:12px;margin:8px 0 0}
input[type=file]{display:none}
@media(max-width:560px){.hm{display:none}td,th{padding:8px 5px}}
</style></head><body>
<div class="w">
<nav><a class="lg" href="index.html"><img src="assets/logo.png" alt="">Osui!</a>
<a class="btn" href="#top" data-i="top50">Top 50</a><span id="nf"></span><span id="nu"></span><button class="langbtn" type="button">EN</button></nav>
<main id="app"><section data-i="loading">Đang tải…</section></main>
</div>
<script src="i18n.js"></script>
<script src="firebase-config.js"></script>
<script type="module">
const CFG=window.OSUI_FIREBASE||{},CDN='https://www.gstatic.com/firebasejs/10.14.1/';
const t=(k,v)=>I18N.t(k,v);
const $=id=>document.getElementById(id),app=$('app');
const esc=x=>String(x==null?'':x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const loc=()=>I18N.lang==='en'?'en-US':'vi-VN';
const ready=!!(CFG.apiKey&&CFG.projectId&&!/^YOUR_/.test(CFG.apiKey));
I18N.apply();
if(!ready){const f=()=>{app.innerHTML='<section><h1>'+t('notCfg')+'</h1><p class="dim">'+t('notCfgP')+'</p></section>'};f();I18N.onChange(f)}
else{
const[{initializeApp},au,fs]=await Promise.all([import(CDN+'firebase-app.js'),import(CDN+'firebase-auth.js'),import(CDN+'firebase-firestore.js')]);
const A=au.getAuth(initializeApp(CFG)),D=fs.getFirestore(A.app);
const setAuthLang=()=>{try{A.languageCode=I18N.lang}catch(e){}};setAuthLang();
const NAME_RE=/^[A-Za-z0-9_.\-]{3,16}$/;
const AVRE=/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+\/=]+$/;
const emsg=e=>{const k=e&&e.code;if(k&&k.indexOf('auth/')===0){const m=t(k);if(m!==k)return m}return(e&&e.code==='permission-denied')?t('fRules'):(e&&e.message)||t('errGeneric')};
let CU=null,PROF=null,ready1=false,FR=null;
const num=(x,d=0)=>Number(x||0).toLocaleString(loc(),{minimumFractionDigits:d,maximumFractionDigits:d});
const ago=ts=>{const d=new Date(ts);return d.toLocaleDateString(loc())+' '+d.toLocaleTimeString(loc(),{hour:'2-digit',minute:'2-digit'})};
const mods=a=>(a&&a.length?a.map(m=>'<span class="mod">'+esc(m)+'</span>').join(''):'<span class="dim">—</span>');
const mapName=r=>'<div class="ti">'+esc(r.title)+(r.cv?' <span class="mod">conv</span>':'')+'</div><div class="ar">'+esc(r.artist)+' · ['+esc(r.ver)+'] · '+num(r.sr,2)+'★</div>';
// avatar: chỉ nhận data URL ảnh hợp lệ
const av=(u,s)=>{s=s||32;const a=u&&typeof u.avatar==='string'&&AVRE.test(u.avatar)?u.avatar:'';return'<i class="av" style="--s:'+s+'px'+(a?";background-image:url('"+a+"')":'')+'">'+(a?'':esc(((u&&u.name)||'?').charAt(0).toUpperCase()))+'</i>'};
async function loadProf(){PROF=null;if(!CU)return;try{const s=await fs.getDoc(fs.doc(D,'users',CU.uid));PROF=s.exists()?s.data():null}catch(e){}}
const canFriend=()=>CU&&CU.emailVerified&&PROF;
// ---- bạn bè: tải 3 danh sách (bạn, lời mời đến, lời mời đã gửi) ----
async function loadFriends(){FR={friends:[],inc:[],out:[]};if(!canFriend())return FR;
 try{const[a,b,c]=await Promise.all([fs.getDocs(fs.query(fs.collection(D,'friends'),fs.where('members','array-contains',CU.uid))),fs.getDocs(fs.query(fs.collection(D,'friendReqs'),fs.where('to','==',CU.uid))),fs.getDocs(fs.query(fs.collection(D,'friendReqs'),fs.where('from','==',CU.uid)))]);
  a.forEach(d=>{const x=d.data(),me=x.a===CU.uid;FR.friends.push({id:d.id,uid:me?x.b:x.a,name:me?x.bName:x.aName,since:x.since})});
  b.forEach(d=>{const x=d.data();FR.inc.push({id:d.id,uid:x.from,name:x.fromName,t:x.t})});
  c.forEach(d=>{const x=d.data();FR.out.push({id:d.id,uid:x.to,name:x.toName,t:x.t})});
  FR.friends.sort((p,q)=>String(p.name).localeCompare(String(q.name)));FR.inc.sort((p,q)=>q.t-p.t);FR.out.sort((p,q)=>q.t-p.t)}catch(e){FR.err=e}
 return FR}
const relOf=uid=>{if(!FR||!CU)return'';if(uid===CU.uid)return'self';if(FR.friends.some(f=>f.uid===uid))return'friend';if(FR.inc.some(f=>f.uid===uid))return'incoming';if(FR.out.some(f=>f.uid===uid))return'sent';return'none'};
async function sendReq(uid,name){if(!canFriend())throw new Error(t(CU?'fNeedVerify':'fNeedLogin'));if(uid===CU.uid)throw new Error(t('fSelfErr'));
 await loadFriends();const r=relOf(uid);if(r==='friend')throw new Error(t('fAlready'));if(r==='sent')throw new Error(t('fAlreadySent'));
 if(r==='incoming'){await acceptReq(FR.inc.find(f=>f.uid===uid));return'accepted'}
 await fs.setDoc(fs.doc(D,'friendReqs',CU.uid+'_'+uid),{from:CU.uid,fromName:PROF.name,to:uid,toName:name,t:Date.now()});return'sent'}
async function acceptReq(r){const b=fs.writeBatch(D);b.set(fs.doc(D,'friends',r.id),{a:r.uid,b:CU.uid,aName:r.name,bName:PROF.name,members:[r.uid,CU.uid],since:Date.now()});b.delete(fs.doc(D,'friendReqs',r.id));await b.commit()}
const delReq=id=>fs.deleteDoc(fs.doc(D,'friendReqs',id));
const delFriend=id=>fs.deleteDoc(fs.doc(D,'friends',id));
async function nav(){$('nu').innerHTML=CU?(PROF?'<a class="btn" href="#me" style="gap:8px;padding:5px 14px 5px 6px">'+av(PROF,26)+esc(PROF.name)+'</a> ':'')+'<button class="btn" id="lo">'+t('logout')+'</button>':'<a class="btn p" href="#login">'+t('loginUp')+'</a>';
 if(CU)$('lo').onclick=()=>au.signOut(A);
 const n=FR&&FR.inc?FR.inc.length:0;$('nf').innerHTML=canFriend()?'<a class="btn" href="#friends">'+t('friends')+(n?'<span class="bdg">'+n+'</span>':'')+'</a>':''}
const sec=h=>{app.innerHTML='<section>'+h+'</section>'};
const ERR=e=>e&&e.code==='failed-precondition'?t('errIndex'):t('errLoad')+(e&&e.message?esc(e.message):'');

// ---- Top 50 ----
async function top(mode){mode=mode==='mania'?'mania':'std';sec('<h1>'+t('top50H')+'</h1><div class="tab"><button data-m="std" class="'+(mode==='std'?'on':'')+'">'+t('osu')+'</button><button data-m="mania" class="'+(mode==='mania'?'on':'')+'">'+t('mania')+'</button></div><div id="tb" class="sc">'+t('loading')+'</div><p class="dim" style="font-size:12px;margin-bottom:0">'+t('ppNote')+'</p>');
 app.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{location.hash='#top/'+b.dataset.m});
 try{const f='pp_'+mode,s=await fs.getDocs(fs.query(fs.collection(D,'users'),fs.orderBy(f,'desc'),fs.limit(50))),a=[];s.forEach(d=>{const x=d.data();if(x[f]>0)a.push({id:d.id,...x})});
  $('tb').innerHTML=a.length?'<table><tr><th>#</th><th>'+t('player')+'</th><th class="num">'+t('pp')+'</th><th class="num hm">'+t('plays')+'</th></tr>'+a.map((u,i)=>'<tr class="cl" data-u="'+esc(u.id)+'"><td class="'+(i<3?'rk'+(i+1):'')+'">'+(i+1)+'</td><td><div class="pid">'+av(u,28)+esc(u.name)+'</div></td><td class="num"><b>'+num(u[f],2)+'</b></td><td class="num hm">'+num(u.plays)+'</td></tr>').join('')+'</table>':'<p class="dim">'+t('noRank')+'</p>';
  $('tb').querySelectorAll('[data-u]').forEach(r=>r.onclick=()=>{location.hash='#u/'+r.dataset.u})}
 catch(e){$('tb').innerHTML='<p class="msg er">'+ERR(e)+'</p>'}}

// ---- Ảnh đại diện: cắt vuông + thu nhỏ ----
function fileToAvatar(file){return new Promise((res,rej)=>{if(!file||!/^image\//.test(file.type))return rej(new Error(t('avBadFile')));if(file.size>10*1024*1024)return rej(new Error(t('avTooBig')));
 const url=URL.createObjectURL(file),im=new Image();im.onload=()=>{try{const S=Math.min(im.naturalWidth,im.naturalHeight),sx=(im.naturalWidth-S)/2,sy=(im.naturalHeight-S)/2;
  for(const[px,q]of[[160,.85],[160,.7],[128,.7],[96,.65]]){const c=document.createElement('canvas');c.width=c.height=px;const x=c.getContext('2d');x.fillStyle='#1c1438';x.fillRect(0,0,px,px);x.imageSmoothingQuality='high';x.drawImage(im,sx,sy,S,S,0,0,px,px);const d=c.toDataURL('image/jpeg',q);if(d.length<=45000){URL.revokeObjectURL(url);return res(d)}}
  URL.revokeObjectURL(url);rej(new Error(t('avTooBig')))}catch(e){rej(e)}};im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error(t('avBadFile')))};im.src=url})}
async function setAvatar(v){await fs.updateDoc(fs.doc(D,'users',CU.uid),{avatar:v});PROF.avatar=v}

// ---- Hồ sơ ----
async function profile(uid,mode,tabN){mode=mode==='mania'?'mania':'std';tabN=tabN==='h'?'h':'r';
 sec(t('loading'));let u;try{const s=await fs.getDoc(fs.doc(D,'users',uid));if(!s.exists())return sec('<h1>'+t('notFound')+'</h1>');u=s.data()}catch(e){return sec('<p class="msg er">'+ERR(e)+'</p>')}
 const own=!!(CU&&uid===CU.uid),base='#'+(own?'me':'u/'+uid),m=mode==='mania'?1:0;
 if(!own&&canFriend()&&!FR)await loadFriends();
 sec('<div class="phead">'+av(u,84)+'<div class="grow"><h1>'+esc(u.name)+(own&&!CU.emailVerified?' <span class="mod" style="font-size:12px">'+t('verifyBadge')+'</span>':'')+'</h1><div class="acts" id="pa"></div><div class="msg" id="pm"></div></div></div>'
  +'<div class="stats"><div class="stat"><small>'+t('ppStd')+'</small><b>'+num(u.pp_std,2)+'</b></div><div class="stat"><small>'+t('ppMania')+'</small><b>'+num(u.pp_mania,2)+'</b></div><div class="stat"><small>'+t('playCount')+'</small><b>'+num(u.plays)+'</b></div></div>'
  +'<div class="tab"><button data-m="std" class="'+(mode==='std'?'on':'')+'">'+t('osu')+'</button><button data-m="mania" class="'+(mode==='mania'?'on':'')+'">'+t('mania')+'</button><span style="flex:1"></span><button data-t="r" class="'+(tabN==='r'?'on':'')+'">'+t('records')+'</button><button data-t="h" class="'+(tabN==='h'?'on':'')+'">'+t('history')+'</button></div><div id="pb" class="sc">'+t('loading')+'</div>');
 const pm=(x,ok)=>{$('pm').className='msg '+(ok?'ok':'er');$('pm').textContent=x||''};
 // nút hành động
 const pa=$('pa');
 if(own){pa.innerHTML='<label class="btn sm p" for="avf">'+t('changeAv')+'</label><input id="avf" type="file" accept="image/*">'+(u.avatar?'<button class="btn sm dg" id="avx">'+t('removeAv')+'</button>':'')+'<a class="btn sm" href="#friends">'+t('friends')+'</a>';
  const hint=document.createElement('p');hint.className='hint';hint.textContent=CU.emailVerified?t('avHint'):t('avNeedVerify');pa.parentNode.appendChild(hint);
  $('avf').onchange=async ev=>{const f=ev.target.files&&ev.target.files[0];ev.target.value='';if(!f)return;if(!CU.emailVerified)return pm(t('avNeedVerify'));
   try{pm(t('avSaving'),1);const d=await fileToAvatar(f);await setAvatar(d);await nav();profile(uid,mode,tabN);setTimeout(()=>{const e=$('pm');if(e){e.className='msg ok';e.textContent=t('avSaved')}},0)}
   catch(e){pm((e&&e.code==='permission-denied')?t('avRules'):(e&&e.code?t('avFail'):'')+(e&&e.message?e.message:''))}};
  if($('avx'))$('avx').onclick=async()=>{try{await setAvatar('');await nav();profile(uid,mode,tabN)}catch(e){pm(emsg(e))}}}
 else if(canFriend()&&FR){const r=relOf(uid),lab={none:t('fAdd'),sent:t('fSent'),incoming:t('fAcceptBtn'),friend:t('fFriends')}[r];
  pa.innerHTML='<button class="btn sm '+(r==='none'||r==='incoming'?'p':'')+'" id="fb"'+(r==='sent'?' disabled':'')+'>'+lab+'</button>'+(r==='friend'?'<button class="btn sm dg" id="fx">'+t('unfriend')+'</button>':'');
  const redo=()=>profile(uid,mode,tabN);
  if($('fb'))$('fb').onclick=async()=>{if(r!=='none'&&r!=='incoming')return;try{const x=await sendReq(uid,u.name);await loadFriends();await nav();await redo();setTimeout(()=>{const e=$('pm');if(e){e.className='msg ok';e.textContent=x==='accepted'?t('fAcceptOk',{name:u.name}):t('fSentOk',{name:u.name})}},0)}catch(e){pm(emsg(e))}};
  if($('fx'))$('fx').onclick=async()=>{if(!confirm(t('confirmUnf',{name:u.name})))return;try{await delFriend(FR.friends.find(f=>f.uid===uid).id);await loadFriends();await nav();redo()}catch(e){pm(emsg(e))}}}
 const go=(mo,tt)=>{location.hash=base+'/'+mo+'/'+tt};
 app.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>go(b.dataset.m,tabN));app.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>go(mode,b.dataset.t));
 try{
  if(tabN==='r'){const s=await fs.getDocs(fs.query(fs.collection(D,'scores'),fs.where('uid','==',uid),fs.where('mode','==',m),fs.orderBy('pp','desc'),fs.limit(100))),a=[];s.forEach(d=>a.push(d.data()));
   $('pb').innerHTML=a.length?'<table><tr><th>#</th><th>'+t('map')+'</th><th class="num">'+t('score')+'</th><th class="num hm">'+t('acc')+'</th><th class="hm">'+t('rank')+'</th><th class="hm">'+t('mod')+'</th><th class="num">'+t('pp')+'</th><th class="num hm">'+t('counted')+'</th></tr>'+a.map((r,i)=>'<tr><td>'+(i+1)+'</td><td>'+mapName(r)+'<div class="ar">'+ago(r.date)+'</div></td><td class="num">'+num(r.score)+'</td><td class="num hm">'+num(r.acc*100,2)+'%</td><td class="hm"><span class="rkc '+esc(r.rk)+'">'+esc(r.rk)+'</span></td><td class="hm">'+mods(r.mods)+'</td><td class="num"><b>'+num(r.pp,2)+'</b></td><td class="num hm dim">'+num(r.pp*Math.pow(.95,i),2)+'</td></tr>').join('')+'</table>':'<p class="dim">'+t('noRec')+'</p>'}
  else{const s=await fs.getDocs(fs.query(fs.collection(D,'plays'),fs.where('uid','==',uid),fs.orderBy('date','desc'),fs.limit(100))),a=[];s.forEach(d=>{const x=d.data();if(x.mode===m)a.push(x)});
   $('pb').innerHTML=a.length?'<table><tr><th>'+t('time')+'</th><th>'+t('map')+'</th><th class="num">'+t('score')+'</th><th class="num hm">'+t('acc')+'</th><th class="hm">'+t('rank')+'</th><th class="hm">'+t('mod')+'</th><th class="num">'+t('pp')+'</th></tr>'+a.map(r=>'<tr><td class="dim" style="white-space:nowrap">'+ago(r.date)+'</td><td>'+mapName(r)+'</td><td class="num">'+num(r.score)+'</td><td class="num hm">'+num(r.acc*100,2)+'%</td><td class="hm"><span class="rkc '+esc(r.rk)+'">'+esc(r.rk)+'</span></td><td class="hm">'+mods(r.mods)+'</td><td class="num"><b>'+num(r.pp,2)+'</b></td></tr>').join('')+'</table>':'<p class="dim">'+t('noPlay')+'</p>'}}
 catch(e){$('pb').innerHTML='<p class="msg er">'+ERR(e)+'</p>'}}

// ---- Bạn bè ----
async function friendsView(){
 if(!CU){location.hash='#login';return}if(!CU.emailVerified)return verifyView();
 sec('<h1>'+t('friendsH')+'</h1><div>'+t('loading')+'</div>');await loadFriends();await nav();
 if(FR.err){return sec('<h1>'+t('friendsH')+'</h1><p class="msg er">'+(FR.err.code==='permission-denied'?t('fRules'):ERR(FR.err))+'</p>')}
 const row=(x,btns,sub)=>'<div class="row2"><span data-u="'+esc(x.uid)+'" class="nm" style="display:flex;align-items:center;gap:10px"><span id="av_'+esc(x.uid)+'">'+av({name:x.name},38)+'</span><span style="min-width:0"><span class="nmt">'+esc(x.name)+'</span>'+(sub?'<small>'+sub+'</small>':'')+'</span></span>'+btns+'</div>';
 sec('<h1>'+t('friendsH')+'</h1><div class="fgrp" style="margin-top:0"><h2>'+t('addFriendH')+'</h2><form class="addf" id="af" style="margin:0"><input id="an" maxlength="16" autocapitalize="off" autocomplete="off" placeholder="'+esc(t('addFriendPh'))+'"><button class="btn p" id="ab" style="white-space:nowrap">'+t('addFriendBtn')+'</button></form><div class="msg" id="fm"></div></div>'
  +'<div class="fgrp"><h2>'+t('reqIn')+(FR.inc.length?'<span class="bdg">'+FR.inc.length+'</span>':'')+'</h2>'+(FR.inc.length?FR.inc.map(r=>row(r,'<button class="btn sm p" data-ac="'+esc(r.id)+'">'+t('accept')+'</button><button class="btn sm" data-dc="'+esc(r.id)+'">'+t('decline')+'</button>')).join(''):'<p class="dim" style="margin:6px 0">'+t('noReqIn')+'</p>')+'</div>'
  +'<div class="fgrp"><h2>'+t('reqOut')+'</h2>'+(FR.out.length?FR.out.map(r=>row(r,'<button class="btn sm" data-dc="'+esc(r.id)+'">'+t('cancel')+'</button>')).join(''):'<p class="dim" style="margin:6px 0">'+t('noReqOut')+'</p>')+'</div>'
  +'<div class="fgrp"><h2>'+t('myFriends')+' ('+FR.friends.length+')</h2>'+(FR.friends.length?FR.friends.map(f=>row(f,'<button class="btn sm dg" data-uf="'+esc(f.id)+'" data-n="'+esc(f.name)+'">'+t('unfriend')+'</button>',t('since')+' '+new Date(f.since).toLocaleDateString(loc()))).join(''):'<p class="dim" style="margin:6px 0">'+t('noFriends')+'</p>')+'</div>');
 const fm=(x,ok)=>{const e=$('fm');if(e){e.className='msg '+(ok?'ok':'er');e.textContent=x||''}};
 app.querySelectorAll('[data-u]').forEach(e=>e.onclick=()=>{location.hash='#u/'+e.dataset.u});
 // tải avatar của từng người (chỉ đọc hồ sơ công khai)
 [...new Set([...FR.friends,...FR.inc,...FR.out].map(x=>x.uid))].forEach(async id=>{try{const s=await fs.getDoc(fs.doc(D,'users',id));if(s.exists()){const e=$('av_'+id);if(e)e.innerHTML=av(s.data(),38)}}catch(_){}});
 const redo=async()=>{await loadFriends();await nav();friendsView()};
 app.querySelectorAll('[data-ac]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{const r=FR.inc.find(x=>x.id===b.dataset.ac);await acceptReq(r);await loadFriends();await nav();await friendsView();fm(t('fAcceptOk',{name:r.name}),1)}catch(e){fm(emsg(e));b.disabled=false}});
 app.querySelectorAll('[data-dc]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{await delReq(b.dataset.dc);await redo()}catch(e){fm(emsg(e));b.disabled=false}});
 app.querySelectorAll('[data-uf]').forEach(b=>b.onclick=async()=>{if(!confirm(t('confirmUnf',{name:b.dataset.n})))return;b.disabled=true;try{await delFriend(b.dataset.uf);await redo()}catch(e){fm(emsg(e));b.disabled=false}});
 $('af').onsubmit=async ev=>{ev.preventDefault();const n=$('an').value.trim();if(!n)return;$('ab').disabled=true;fm('…',1);
  try{if(!NAME_RE.test(n))throw new Error(t('fNotFound',{name:n}));const us=await fs.getDoc(fs.doc(D,'usernames',n.toLowerCase()));if(!us.exists())throw new Error(t('fNotFound',{name:n}));
   const uid=us.data().uid,ps=await fs.getDoc(fs.doc(D,'users',uid));if(!ps.exists())throw new Error(t('fNotFound',{name:n}));const name=ps.data().name;
   const x=await sendReq(uid,name);await loadFriends();await nav();await friendsView();fm(x==='accepted'?t('fAcceptOk',{name}):t('fSentOk',{name}),1)}
  catch(e){fm(emsg(e));$('ab').disabled=false}}}

// ---- Đăng nhập / đăng ký ----
function authView(tab){tab=tab==='up'?'up':'in';
 if(CU&&!CU.emailVerified)return verifyView();if(CU)return(location.hash='#me');
 sec('<h1>'+t('account')+'</h1><div class="tab" style="justify-content:center"><button data-t="in" class="'+(tab==='in'?'on':'')+'">'+t('login')+'</button><button data-t="up" class="'+(tab==='up'?'on':'')+'">'+t('signup')+'</button></div><form id="fm"><input id="e" type="email" autocomplete="email" placeholder="'+esc(t('email')+(CFG.onlyGmail?' (@gmail.com)':''))+'" required>'+(tab==='up'?'<input id="n" autocomplete="username" maxlength="16" placeholder="'+esc(t('username'))+'" required>':'')+'<input id="p" type="password" autocomplete="'+(tab==='up'?'new-password':'current-password')+'" placeholder="'+esc(t('password'))+'" required>'+(tab==='up'?'<input id="q" type="password" autocomplete="new-password" placeholder="'+esc(t('password2'))+'" required>':'')+'<div class="msg" id="mg"></div><button class="btn p" style="width:100%;justify-content:center" id="go">'+(tab==='in'?t('login'):t('createAcc'))+'</button>'+(tab==='in'?'<p style="text-align:center"><a href="#" id="fg" class="dim">'+t('forgot')+'</a></p>':'<p class="dim" style="font-size:13px">'+t('signupNote')+'</p>')+'</form>');
 app.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{location.hash='#login/'+b.dataset.t});
 const mg=(x,ok)=>{$('mg').className='msg '+(ok?'ok':'er');$('mg').textContent=x};
 if($('fg'))$('fg').onclick=async ev=>{ev.preventDefault();const e=$('e').value.trim();if(!e)return mg(t('typeEmailFirst'));try{await au.sendPasswordResetEmail(A,e);mg(t('resetSent'),1)}catch(x){mg(emsg(x))}};
 $('fm').onsubmit=async ev=>{ev.preventDefault();$('go').disabled=true;mg('…',1);const e=$('e').value.trim(),p=$('p').value;
  try{if(tab==='in'){await au.signInWithEmailAndPassword(A,e,p)}
   else{const n=$('n').value.trim(),key=n.toLowerCase();if(CFG.onlyGmail&&!/@gmail\.com$/i.test(e))throw new Error(t('onlyGmail'));if(!NAME_RE.test(n))throw new Error(t('nameRule'));if(p.length<6)throw new Error(t('pwMin'));if(p!==$('q').value)throw new Error(t('pwMismatch'));
    if((await fs.getDoc(fs.doc(D,'usernames',key))).exists())throw new Error(t('nameTaken'));
    let cr;try{cr=await au.createUserWithEmailAndPassword(A,e,p)}catch(x){throw new Error(emsg(x))}
    try{const b=fs.writeBatch(D);b.set(fs.doc(D,'usernames',key),{uid:cr.user.uid});b.set(fs.doc(D,'users',cr.user.uid),{name:n,nameLower:key,pp_std:0,pp_mania:0,plays:0,created:Date.now()});await b.commit()}catch(x){try{await au.deleteUser(cr.user)}catch(_){}throw new Error(t('profileFail'))}
    try{await au.sendEmailVerification(cr.user)}catch(x){}}}
  catch(x){mg(emsg(x));$('go').disabled=false}}}
function verifyView(){sec('<h1>'+t('verifyH')+'</h1><p>'+t('verifyP',{email:esc(CU.email)})+'</p><div class="msg" id="mg"></div><p><button class="btn p" id="ok">'+t('verified')+'</button> <button class="btn" id="rs">'+t('resend')+'</button></p>');
 const mg=(x,ok)=>{$('mg').className='msg '+(ok?'ok':'er');$('mg').textContent=x};
 $('ok').onclick=async()=>{try{await CU.reload();await CU.getIdToken(true);CU=A.currentUser;if(CU.emailVerified){await loadProf();await loadFriends();await nav();location.hash='#me';route()}else mg(t('notVerified'))}catch(x){mg(emsg(x))}};
 $('rs').onclick=async()=>{try{await au.sendEmailVerification(CU);mg(t('resent'),1)}catch(x){mg(emsg(x))}}}

function route(){if(!ready1)return;const p=(location.hash||'#top').slice(1).split('/');
 if(p[0]==='top')return top(p[1]);
 if(p[0]==='login')return authView(p[1]);
 if(p[0]==='friends')return friendsView();
 if(p[0]==='u'&&p[1]){if(CU&&p[1]===CU.uid){location.hash='#me';return}return profile(p[1],p[2],p[3])}
 if(p[0]==='me'){if(!CU){location.hash='#login';return}if(!CU.emailVerified)return verifyView();return profile(CU.uid,p[1],p[2])}
 top('std')}
addEventListener('hashchange',route);
I18N.onChange(()=>{setAuthLang();nav();route()});
au.onAuthStateChanged(A,async u=>{CU=u;FR=null;await loadProf();if(canFriend())await loadFriends();ready1=true;await nav();route()});
}
</script></body></html>
